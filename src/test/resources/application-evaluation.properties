# Evaluation Configuration
logging.level.org.springframework.ai.evaluation=DEBUG

# Evaluation Model (Use a strong model for evaluation)
evaluation.chat.provider=openai
evaluation.chat.model=Qwen/Qwen2.5-14B-Instruct
evaluation.chat.base-url=https://api.siliconflow.cn
# API Key will be injected from environment variable or system property
# evaluation.chat.api-key=${SILICONFLOW_KEY}

# Evaluation Thresholds
evaluation.relevance.threshold=0.7
evaluation.factuality.threshold=0.8
