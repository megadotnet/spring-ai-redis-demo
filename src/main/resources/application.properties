spring.main.allow-bean-definition-overriding=true
spring.ai.ollama.base-url=http://127.0.0.1:11434
spring.ai.ollama.embedding.options.model=bge-m3:latest
spring.ai.ollama.chat.options.model=qwen2.5:0.5b
spring.ai.ollama.connection-timeout=60s
spring.ai.ollama.read-timeout=60s
logging.level.com.redis.demo.spring.ai=DEBUG
logging.level.org.springframework.ai=DEBUG
spring.ai.vectorstore.pinecone.dimension=1024
spring.ai.vectorstore.pinecone.index-name=paper_collection_vpdf

# SSL configuration to handle certificate issues
javax.net.ssl.trustStore=
javax.net.ssl.trustStorePassword=
javax.net.ssl.trustStoreType=

# Disable SSL certificate validation (for development only)
permissive.ssl=true

# Milvus éç½®
spring.ai.vectorstore.milvus.client.host=10.1.1.234
spring.ai.vectorstore.milvus.client.port=19530
spring.ai.vectorstore.milvus.collection-name=paper_collection_vpdf
spring.ai.vectorstore.milvus.database-name=default
spring.ai.vectorstore.milvus.index-type=IVF_FLAT
spring.ai.vectorstore.milvus.metric-type=IP
spring.ai.vectorstore.milvus.consistency-level=STRONG
spring.ai.vectorstore.milvus.embeddingDimension=1024

# 召回阶段的 topK 值（增大以获取更多候选文档供 rerank 精排）
topk=10

# Rerank 精排配置 (使用硅基流动 SiliconFlow API)
# API Key 优先从环境变量 SILICONFLOW_KEY 获取，也可在此配置
# siliconflow.api-key=your-api-key-here
rerank.enabled=true
rerank.model=BAAI/bge-reranker-v2-m3
rerank.topN=5

# 学术论文分块配置 (Academic Paper Chunking Configuration)
# 针对论文场景优化的参数，适合长段落和结构化内容
chunking.defaultChunkSize=1000
chunking.minChunkSizeChars=400
chunking.minChunkLengthToEmbed=5
chunking.maxNumChunks=10000
chunking.keepSeparator=true

# 切块算法配置 (markdown: 自定义Markdown切块, token: TokenTextSplitter)
# 默认使用 markdown 算法，基于 Markdown 语义结构进行分块
chunking.algorithm=markdown

# MarkdownProcessor 自定义切块参数
# chunkTokenNum: 每个分块的目标Token数
# delimiter: 分割符，用于语义分割
# separateTables: 是否将表格单独分块
chunking.markdown.chunkTokenNum=4096
chunking.markdown.delimiter=\n!?;。；！？
chunking.markdown.separateTables=true

# DeepSeek-OCR PDF 文档识别配置
# API Key 从环境变量 SILICONFLOW_KEY 获取
deepseek-ocr.enabled=true
deepseek-ocr.model=deepseek-ai/DeepSeek-OCR