spring.ai.vectorstore.redis.index=beers
spring.ai.vectorstore.redis.prefix=beer:
spring.ai.vectorstore.redis.uri=redis://192.168.0.107:6379
spring.main.allow-bean-definition-overriding=true
spring.ai.openai.base-url=https://api.siliconflow.cn
spring.ai.openai.api-key=${OPENAPI_KEY}
spring.ai.openai.model=deepseek-ai/DeepSeek-V3
spring.ai.openai.chat.completion-path=/v1/chat/completions
spring.ai.openai.chat.options.model=deepseek-ai/DeepSeek-V3
spring.ai.embedding.transformer.tokenizer.uri=https://gh.llkk.cc/https://raw.githubusercontent.com/spring-projects/spring-ai/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/tokenizer.json
spring.ai.embedding.transformer.onnx.modelUri=https://gh.llkk.cc/https://github.com/spring-projects/spring-ai/raw/main/models/spring-ai-transformers/src/main/resources/onnx/all-MiniLM-L6-v2/model.onnx
logging.level.org.springframework.ai=DEBUG