
spring.main.allow-bean-definition-overriding=true
spring.ai.openai.base-url=https://api.siliconflow.cn
spring.ai.openai.api-key=${OPENAPI_KEY}
spring.ai.openai.chat.model=deepseek-ai/DeepSeek-V3
spring.ai.openai.chat.options.model=deepseek-ai/DeepSeek-V3
spring.ai.model.embedding=openai
spring.ai.openai.embedding.options.model=BAAI/bge-large-en-v1.5
logging.level.com.redis.demo.spring.ai=DEBUG
logging.level.org.springframework.ai=DEBUG
spring.ai.vectorstore.pinecone.dimension=1024
spring.ai.vectorstore.pinecone.index-name=beers-english